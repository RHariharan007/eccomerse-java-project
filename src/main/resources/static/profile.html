<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAT-CART | Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="navbar"></div>
<main class="container page">
  <div class="products-heading"><div><span class="eyebrow dark">MY ACCOUNT</span><h1>Profile</h1></div></div>
  <form id="profile-form" class="card narrow">
    <label>Name<input id="profile-name" required></label>
    <label>Email<input id="profile-email" type="email" required></label>
    <label>Phone<input id="profile-phone"></label>
    <button class="btn" type="submit">Save Profile</button>
  </form>
  <div class="card narrow account-actions">
    <a class="btn secondary" href="address.html">Manage Address</a>
    <button id="logout-btn" class="btn danger">Logout</button>
  </div>
</main>
<div id="footer"></div>
<script src="commons.js"></script>
<script src="profile.js"></script>
</body>
</html>
